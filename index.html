<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisas de Satisfação — Associação Volvo</title>
<meta name="description" content="Portal das pesquisas de satisfação dos eventos da Associação Volvo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/portal.css?v=8">
</head>
<body>

<div class="cortina" id="cortina">
  <img src="assets/img/logo-branco.png" alt="Associação Volvo">
</div>

<div class="hero">
  <div class="hero-bg">
    <span class="aurora a1"></span>
    <span class="aurora a2"></span>
    <span class="aurora a3"></span>
  </div>
  <div class="hero-particulas" id="particulas"></div>
  <div class="wrap">
    <img class="hero-logo" src="assets/img/logo-branco.png" alt="Associação Volvo">
    <h1>Pesquisas de Satisfação</h1>
    <div class="filete"></div>
    <p class="sub">A opinião dos nossos associados sobre cada evento, reunida em um só lugar.</p>
    <div class="stats" id="stats"></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="sec-head">
      <h2>Eventos</h2>
      <span class="conta" id="conta"></span>
    </div>
    <div class="grade" id="grade"></div>
  </div>
</main>

<footer>
  <div class="wrap">
    <img class="footer-logo" src="assets/img/logo-teal.png" alt="Associação Volvo">
  </div>
</footer>

<script src="eventos.js?v=8"></script>
<script src="assets/portal.js?v=8"></script>
</body>
</html>
